name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild (Mondays 05:00 UTC), even with no changes, so build-time
  # data — each project's last GitHub push — stays fresh.
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Quality gate: nothing is deployed unless this passes. Runs on its own
  # build of the site (the deploy job keeps using withastro/action).
  check:
    runs-on: ubuntu-latest
    env:
      # Raises the GitHub API rate limit for the build-time activity data.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check (strict TypeScript)
        run: npx astro sync && npx -y -p typescript@5 tsc --noEmit -p .
      - name: Build
        run: npx astro build
      - name: Broken internal links
        run: node scripts/ci/check-links.mjs dist
      - name: Weight budget
        run: node scripts/ci/check-budget.mjs dist
      - name: Document viewer pages match their PDFs
        run: node scripts/ci/check-documents.mjs
      - name: Install browser checks (not project dependencies)
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Accessibility, console errors and overflow on every page
        run: |
          npx astro preview --port 4321 &
          npx -y wait-on http://localhost:4321/ --timeout 60000
          node scripts/ci/check-pages.mjs http://localhost:4321

  # Visual regression: every page's screenshot vs tests/visual/. Runs in
  # the official Playwright container so fonts render exactly as when the
  # baselines were made (scripts/ci/visual.sh, same image, locally).
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble # = PLAYWRIGHT in visual.sh
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Build (without the drifting GitHub dates)
        run: GITHUB_ACTIVITY=off npx astro build
      - name: Install the screenshot tools (not project dependencies)
        run: npm install --no-save --no-audit --no-fund playwright@1.63.0 pixelmatch@7 pngjs@7
      - name: Compare every page with its baseline
        run: |
          # 127.0.0.1, not localhost: in the container localhost can
          # resolve to ::1, where the preview server isn't listening.
          npx astro preview --host 127.0.0.1 --port 4321 &
          npx -y wait-on http-get://127.0.0.1:4321/ --timeout 60000
          node scripts/ci/check-visual.mjs http://127.0.0.1:4321
      - name: Upload the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: visual-report/

  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload the site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: [check, visual, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
